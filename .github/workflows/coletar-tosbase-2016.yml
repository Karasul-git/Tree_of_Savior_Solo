name: Coletar o ToSBase de 2016
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'O que coletar (lista separada por vírgulas): skills, classes, formulas, monsters, items, recipes, sets, equipment, quests, attributes, npcs, maps, worldmap, collections, statuseffects, gamepages (tabelas de experiência, elementos, PvP), wiki (artigos do wiki de 2016)'
        default: 'skills,classes'
        required: true
permissions:
  contents: write
concurrency:
  group: coletar-tosbase
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retomar do que já foi coletado
        run: |
          git fetch origin data/tosbase-2016 || true
          git checkout origin/data/tosbase-2016 -- data/tosbase-2016 || true
      - name: Coletar as capturas do Internet Archive
        run: python3 scripts/fetch-tosbase-2016.py
        env:
          SCOPE: ${{ inputs.scope }}
          WORKERS: '6'
          MAX_MINUTES: '300'
      - name: Guardar uma cópia do resultado (garantia)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tosbase-2016
          path: data/tosbase-2016
          retention-days: 14
          if-no-files-found: ignore
      - name: Guardar o resultado no branch data/tosbase-2016
        if: always()
        run: |
          # Branch órfão, só com os dados: o GitHub recusa pushes que alterem arquivos de workflow.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf "$RUNNER_TEMP/tosbase-dados"
          cp -r data/tosbase-2016 "$RUNNER_TEMP/tosbase-dados"
          git switch --orphan data/tosbase-2016
          git rm -rf --quiet --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p data
          cp -r "$RUNNER_TEMP/tosbase-dados" data/tosbase-2016
          git add data/tosbase-2016
          git commit -m "Coleta do ToSBase de 2016 (capturas do Internet Archive)"
          git push --force origin data/tosbase-2016
