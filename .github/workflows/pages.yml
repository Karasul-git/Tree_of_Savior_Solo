name: Publicar wiki navegável
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.availability.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Verificar se Pages está habilitado
        id: availability
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages({owner: context.repo.owner, repo: context.repo.repo});
              core.setOutput('enabled', 'true');
            } catch (error) {
              if (![403, 404].includes(error.status)) throw error;
              core.notice('Habilite Settings → Pages → GitHub Actions para publicar. O site foi validado.');
              core.setOutput('enabled', 'false');
            }
      - uses: actions/configure-pages@v5
        if: steps.availability.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.availability.outputs.enabled == 'true'
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
